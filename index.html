<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Sandero</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Sandero"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#050505">
<style>
:root{--bg:#050505;--card:#222a35;--line:#2a3340;--mut:#8a8a8a;--blue:#7ab3ff;--amb:#f5a524;--red:#ef4444;--off:#566070}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.page{position:absolute;inset:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);display:none;padding:8px 10px;flex-direction:column}.page.on{display:flex}
button{font:inherit;color:inherit;background:none;border:0}
.st-off{color:var(--off)}.st-ok{color:var(--blue)}.st-wait{color:var(--amb)}.st-err{color:var(--red)}
.val{color:var(--mut)}.ok{color:var(--blue)}.wait{color:var(--amb)}.err{color:var(--red)}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--mut)}
.dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:50;opacity:0}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;display:none;max-width:90%}
.dots{display:flex;justify-content:center;gap:10px;padding:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#444}.dots i.on{background:#fff}
/* dashboard */
.td{flex:1;display:grid;grid-template-columns:38% 1fr;gap:10px;min-height:0}
.tl{position:relative;display:flex;flex-direction:column;min-height:0;justify-content:space-between}
#clk{position:absolute;left:4px;top:0;font-size:13px;color:#cfcfcf}
.spdwrap{text-align:center;margin-top:18px;background:radial-gradient(ellipse at 50% 45%,#0b2a55 0%,transparent 70%);padding:6px 0}
#spd{font-size:min(26vh,17vw);font-weight:500;line-height:1}.unit{font-size:15px;color:var(--mut)}
.rp{padding:0 12px}.rpmbar{position:relative;height:12px;background:#1d1d1d;border-radius:6px;margin:6px 0 2px;overflow:hidden}
#rpmfill{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue)}.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.vbtn{align-self:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 18px;border-radius:16px;background:#14181d;font-size:10px;letter-spacing:.1em}
.tmap{position:relative;border-radius:14px;overflow:hidden;background:#0c0f14}
#map{width:100%;height:100%;display:block;touch-action:none}
.ban{position:absolute;left:8px;top:8px;display:flex;gap:8px;align-items:center;background:#151a22ee;border-radius:10px;padding:6px 8px;font-size:12px}
.ban button{background:#222a35;border-radius:8px;padding:5px 10px;font-size:12px}
.fc{position:absolute;right:8px;width:38px;height:38px;border-radius:50%;background:#1a1a1cdd;border:1px solid #2a2a2a;display:grid;place-items:center;font-size:18px}
/* launcher */
#launch{overflow-y:auto;background:#101418}
.stat{display:flex;justify-content:space-around;padding:6px 4px 10px}.stat button{padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{background:var(--card);border-radius:18px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.04em;color:#fff;word-break:keep-all}
.grid button svg{color:var(--blue)}.grid button.st-off svg{color:var(--off)}
.smart{margin-top:10px;width:100%;padding:10px;border-radius:16px;background:#1c3a5e;border:1px solid #4a86d4;display:flex;flex-direction:column;align-items:center;gap:2px}
.smart b{display:flex;gap:14px;align-items:center;font-size:18px}.smart small{color:#9fc0ea;letter-spacing:.06em;font-size:11px}
.smart.st-off{background:#1a2330;border-color:#3a4658}.smart.st-off small,.smart.st-off b{color:#8a95a5}
/* info */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hd h1{font-size:18px;font-weight:600;flex:1}.hd h1 small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:400}
.hd button{background:var(--card);border-radius:12px;padding:8px 14px}
.chip{font-size:11px;padding:6px 10px;border-radius:20px;background:var(--card)}
.cards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}
.cd{background:#14181d;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cd svg{width:min(14vh,56px);height:min(14vh,56px)}.cd b{font-size:min(11vh,8vw);font-weight:300}.cd small{font-size:11px;color:var(--mut)}
@media (orientation:portrait){.td{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr}}
</style></head><body>

<section class="page on" id="dash"><div class="td">
 <div class="tl"><span id="clk">--:--</span>
  <div class="spdwrap"><div id="spd" class="val">--</div><div class="unit">km/h</div></div>
  <div class="rp"><div style="display:flex;justify-content:space-between"><span class="lbl">RPM</span><span id="rpm" class="val">--</span></div>
   <div class="rpmbar"><div id="rpmfill"></div></div><div class="ticks"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div></div>
  <button class="vbtn st-off" id="vbtn" data-go="info"><span data-i="car"></span>VEHICLE STATUS</button>
  <div class="dots"><i class="on" data-go="dash"></i><i data-go="launch"></i></div></div>
 <div class="tmap"><canvas id="map"></canvas>
  <div class="ban"><span id="gpsmsg" class="val">GPS: not connected</span><button id="conn">Connect GPS</button></div>
  <button class="fc" id="zin" style="top:8px">+</button><button class="fc" id="zout" style="top:52px">&minus;</button><button class="fc" id="recenter" style="top:100px">&#10148;</button></div>
</div></section>

<section class="page" id="launch">
 <div class="stat" id="sbar"></div><div class="grid" id="apps"></div>
 <button class="smart st-off" id="smart"><b><span data-i="chev"></span>SMART CONTROL<span data-i="sliders"></span></b><small>ESP32 CONNECTION &amp; CONTROL</small></button>
 <div class="dots"><i data-go="dash"></i><i class="on" data-go="launch"></i></div>
</section>

<section class="page" id="info">
 <div class="hd"><button data-go="back">&#9664;</button><h1>اطلاعات خودرو<small>VEHICLE STATUS</small></h1><span class="chip st-off" id="obdchip">OBD2: not connected</span></div>
 <div class="cards">
  <div class="cd st-off" id="c_cool"><span data-i="therm"></span><small>ENGINE COOLANT</small><b id="i_cool">--</b><small>&deg;C</small></div>
  <div class="cd st-off" id="c_oil"><span data-i="oil"></span><small>ENGINE OIL</small><b id="i_oil">--</b><small>&deg;C</small></div>
  <div class="cd st-off" id="c_bat"><span data-i="bat"></span><small>BATTERY</small><b id="i_bat">--</b><small>V</small></div>
 </div>
</section>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast"></div><div class="dim" id="dim"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],now=()=>Date.now();
const P={car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',

map:'<path d="M3 6.6v12.8l6-2.8 6 2.8 6-2.8V3.8l-6 2.8-6-2.8z"/><path d="M9 3.8v12.8M15 6.6v12.8"/>',
folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
radio:'<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5M19.1 4.9c3.9 3.9 3.9 10.3 0 14.2"/><circle cx="12" cy="12" r="2"/>',

obd:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 14l3-3 3 3 4-5"/>',
cloud:'<path d="M12 2v2M4.9 4.9l1.4 1.4M20 12h2M19.1 4.9l-1.4 1.4M15.9 12.7a4 4 0 0 0-5.9-4.2M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6z"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
gear:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',chev:'<path d="m9 18 6-6-6-6"/>',
bt:'<path d="m7 7 10 10-5 5V2l5 5L7 17"/>',wifi:'<path d="M5 12.6a11 11 0 0 1 14.1 0M1.4 9a16 16 0 0 1 21.2 0M8.5 16.1a6 6 0 0 1 7 0M12 20h.01"/>',
sig:'<path d="M7 20v-4M12 20v-8M17 20V8M22 4v16M2 20h.01"/>',data:'<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
batt:'<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/>',pin:'<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/>',
therm:'<path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/>',oil:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5S12.5 5 12 2.5C11.5 5 10 7.400 8 9.500 6 11.100 5 13 5 15a7 7 0 0 0 7 7z"/>',
bat:'<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M6 12h4M8 10v4"/>'};
const I=(k,s=26)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
$$('[data-i]').forEach(e=>e.innerHTML=I(e.dataset.i,e.dataset.i==='car'?30:22));
// data layer: value/time/validity; stale data is never shown as live
const store={};['rpm','cool','oil','bat'].forEach(k=>store[k]={v:null,t:0});
window.Cockpit={push(k,v){if(store[k])store[k]={v,t:now()}}};
const live=k=>{const s=store[k];return s.v!=null&&now()-s.t<4000?s.v:null};
function setV(id,v){const e=$(id);e.textContent=v==null?'--':v;e.className=v==null?'val':'ok'}
const cls=(e,s)=>{e.classList.remove('st-off','st-ok','st-wait','st-err');e.classList.add('st-'+s)};
// pages
let cur='dash',prev='dash';
function go(p){if(p==='back')p=prev;if(p==='info'&&cur!=='info')prev=cur;cur=p;$$('.page').forEach(e=>e.classList.toggle('on',e.id===p));requestAnimationFrame(sizeMap)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(t.dataset.go)});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.target.closest('canvas')?null:e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>80){if(cur==='dash'&&d<0)go('launch');else if(cur==='launch'&&d>0)go('dash')}},{passive:true});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
// launcher
const apps=[['CONTACTS','users','contacts://'],['PHONE','phone','tel:'],['MUSIC','music','music://'],['NAVIGATION','map','https://maps.apple.com/'],
['FILES','folder','shareddocuments://'],['RADIO','radio',null],['CAMERA','cam','#cam'],['OBD2','obd','#obd'],
['WEATHER','cloud','weather://'],['GOOGLE SEARCH','search','https://www.google.com/'],['SETTINGS','gear',null],['CALENDAR','cal','calshow://'],['VEHICLE STATUS','car','#info']];
$('#apps').innerHTML=apps.map((a,i)=>`<button data-a="${i}" ${a[2]==='#obd'?'id="obdtile" class="st-off"':''}>${I(a[1])}${a[0]}</button>`).join('');
$('#apps').onclick=e=>{const b=e.target.closest('button');if(!b)return;const[n,,u]=apps[b.dataset.a];
 if(u==='#info')return go('info');if(u==='#cam')return $('#cam').click();
 if(u==='#obd')return toast(live('rpm')!=null||live('cool')!=null?'OBD2: connected':'OBD2: not connected');
 if(!u)return toast(n+': iOS cannot open this from a web app.');
 let hid=false;document.addEventListener('visibilitychange',()=>hid=document.hidden,{once:true});location.href=u;
 setTimeout(()=>{if(!hid&&!document.hidden)toast(n+': iOS did not open the app.')},1500)};
$('#smart').onclick=()=>toast('ESP32 not connected. Controls appear here once a verified connection exists.');
const sb=[['Bluetooth','bt'],['Wi-Fi','wifi'],['Signal','sig'],['Mobile Data','data'],['Brightness','sun'],['Battery','batt'],['GPS','pin']];
$('#sbar').innerHTML=sb.map((s,i)=>`<button id="sb${i}" class="st-off" data-s="${i}">${I(s[1],24)}</button>`).join('');
$('#sbar').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.s;
 if(i===4){const v=prompt('In-app brightness 20-100',100);if(v){const n=Math.min(100,Math.max(20,+v));$('#dim').style.opacity=1-n/100;cls(b,'ok')}}
 else if(i===6)toast($('#gpsmsg').textContent);else toast(sb[i][0]+': Safari cannot read this status (shown gray = unknown).')};
// GPS
let gpsErr='',pos=null,heading=null,gspeed=null,gpsState='off',watch=null,trail=[],off={x:0,y:0};
function startGPS(){if(!navigator.geolocation){gpsState='err';gpsErr='GPS not supported';return}
 gpsState='wait';if(watch!=null)navigator.geolocation.clearWatch(watch);
 watch=navigator.geolocation.watchPosition(p=>{const c=p.coords;gpsState='ok';gpsErr='';pos={lat:c.latitude,lon:c.longitude,acc:c.accuracy,t:now()};
  gspeed=c.speed!=null&&c.speed>=0?c.speed*3.6:null;heading=(c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>1.5)?c.heading:heading;
  if(c.accuracy<=30){const l=trail[trail.length-1];if(!l||hav(l,pos)>3){trail.push(pos);if(trail.length>1500)trail.shift()}}},
 e=>{gpsState=e.code===1?'err':'wait';gpsErr=e.code===1?'GPS denied: allow Location for Safari':e.code===2?'GPS unavailable':'GPS timeout, retrying'},
 {enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
$('#conn').onclick=startGPS;
setInterval(()=>{if(gpsState==='ok')navigator.geolocation.getCurrentPosition(p=>{if(pos&&p.coords.accuracy<100){pos.t=now();pos.acc=p.coords.accuracy}},()=>{},{maximumAge:3000,timeout:8000})},4000);
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
// map
const cv=$('#map'),cx=cv.getContext('2d'),tiles={};let Z=16;
function sizeMap(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',sizeMap);sizeMap();
$('#recenter').onclick=()=>off={x:0,y:0};$('#zin').onclick=()=>Z=Math.min(18,Z+1);$('#zout').onclick=()=>Z=Math.max(12,Z-1);
const px=(lat,lon)=>{const s=256*2**Z,r=Math.PI/180;return{x:(lon+180)/360*s,y:(1-Math.log(Math.tan(lat*r)+1/Math.cos(lat*r))/Math.PI)/2*s}};
function tile(x,y){const k=Z+'/'+x+'/'+y;if(!tiles[k]){const i=new Image();i.onload=()=>i.ok=true;i.src=`https://tile.openstreetmap.org/${Z}/${x}/${y}.png`;tiles[k]=i}return tiles[k]}
let drag=null;cv.onpointerdown=e=>{drag={x:e.clientX-off.x,y:e.clientY-off.y};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(drag)off={x:e.clientX-drag.x,y:e.clientY-drag.y}};cv.onpointerup=()=>drag=null;
function drawMap(){const w=cv.clientWidth,h=cv.clientHeight;cx.fillStyle='#0c0f14';cx.fillRect(0,0,w,h);
 if(!pos||now()-pos.t>30000){cx.fillStyle='#666';cx.font='14px sans-serif';cx.textAlign='center';cx.fillText(pos?'GPS signal lost':'No position',w/2,h/2);return}
 const c=px(pos.lat,pos.lon);cx.save();cx.translate(w/2+off.x,h/2+off.y);if(heading!=null)cx.rotate(-heading*Math.PI/180);
 const R=Math.hypot(w,h)/2+300,x0=Math.floor((c.x-R)/256),x1=Math.floor((c.x+R)/256),y0=Math.floor((c.y-R)/256),y1=Math.floor((c.y+R)/256);
 cx.strokeStyle='#1b222c';for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const X=x*256-c.x,Y=y*256-c.y,im=x1-x0<12?tile(x,y):null;
  if(im&&im.ok){cx.globalAlpha=.55;cx.drawImage(im,X,Y,256,256);cx.globalAlpha=1}else cx.strokeRect(X,Y,256,256)}
 cx.strokeStyle='#3b78e8';cx.lineWidth=4;cx.beginPath();trail.forEach((p,i)=>{const q=px(p.lat,p.lon);i?cx.lineTo(q.x-c.x,q.y-c.y):cx.moveTo(q.x-c.x,q.y-c.y)});cx.stroke();cx.restore();
 cx.save();cx.translate(w/2,h/2);cx.fillStyle='#fff';cx.beginPath();cx.moveTo(0,-14);cx.lineTo(10,12);cx.lineTo(0,7);cx.lineTo(-10,12);cx.closePath();cx.fill();cx.restore()}
// render
function render(){
 const age=pos?now()-pos.t:1e9,gOk=pos&&age<20000&&gpsState==='ok',sp=gOk&&gspeed!=null&&(age<5000||gspeed<1)?Math.round(gspeed):null;
 setV('#spd',sp);
 const g=$('#gpsmsg'),m={off:['GPS: not connected','val','off'],wait:[gpsErr||'GPS: waiting…','wait','wait'],ok:gOk?['GPS ±'+Math.round(pos.acc)+' m','ok','ok']:['GPS: signal lost','wait','wait'],err:[gpsErr||'GPS error','err','err']}[gpsState];
 g.textContent=m[0];g.className=m[1];cls($('#sb6'),m[2]);
 const r=live('rpm');setV('#rpm',r);$('#rpmfill').style.width=r==null?0:Math.min(100,r/7000*100)+'%';
 ['cool','oil','bat'].forEach(k=>{const v=live(k);setV('#i_'+k,v);cls($('#c_'+k),v==null?'off':'ok')});
 const obd=['rpm','cool','oil','bat'].some(k=>live(k)!=null);
