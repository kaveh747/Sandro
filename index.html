<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Sandero</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Sandero"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#050505">
<style>
:root{--bg:#050505;--card:#222a35;--line:#2a3340;--mut:#8a8a8a;--blue:#7ab3ff;--amb:#f5a524;--red:#ef4444;--off:#566070;--grn:#34c759}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.page{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);display:none;padding:8px 10px;flex-direction:column}.page.on{display:flex}
button{font:inherit;color:inherit;background:none;border:0}
.st-off,.st-unk{color:var(--off)}.st-ok{color:var(--grn)}.st-wait{color:var(--amb)}.st-err{color:var(--red)}
.val{color:var(--mut)}.ok{color:var(--grn)}.wait{color:var(--amb)}.err{color:var(--red)}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--mut)}
.dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:50;opacity:0}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;display:none;max-width:90%}
.dots{display:flex;justify-content:center;gap:10px;padding:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#444}.dots i.on{background:#fff}
/* dashboard */
.td{flex:1;display:grid;grid-template-columns:38% 1fr;gap:10px;min-height:0}
.tl{position:relative;display:flex;flex-direction:column;min-height:0;justify-content:space-between}
#clk,#tmp{font-size:13px;color:#cfcfcf}#top{position:fixed;z-index:20;left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);top:env(safe-area-inset-top,0px);height:30px;display:flex;align-items:center;gap:12px}#sbar{display:flex;gap:2px}#sbar button{padding:2px 6px}
.sheet{position:fixed;inset:0;background:#0b0e12;z-index:40;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0)}.sheet #shb{flex:1;min-height:0;overflow:auto}#shx{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:41;width:40px;height:40px;border-radius:50%;background:#222a35;font-size:18px}
.spdwrap{text-align:center;margin-top:18px;background:radial-gradient(ellipse at 50% 45%,#0b2a55 0%,transparent 70%);padding:6px 0}
#spd{font-size:min(26vh,17vw);font-weight:500;line-height:1}.unit{font-size:15px;color:var(--mut)}
.rp{padding:0 12px}.rpmbar{position:relative;height:12px;background:#1d1d1d;border-radius:6px;margin:6px 0 2px;overflow:hidden}
#rpmfill{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue)}.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.vbtn{align-self:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 18px;border-radius:16px;background:#14181d;font-size:10px;letter-spacing:.1em}
.tmap{position:relative;border-radius:14px;overflow:hidden;background:#0c0f14}
#map{width:100%;height:100%;display:block;touch-action:none}
.ban{position:absolute;left:8px;top:8px;display:flex;gap:8px;align-items:center;background:#151a22ee;border-radius:10px;padding:6px 8px;font-size:12px}
.ban button{background:#222a35;border-radius:8px;padding:5px 10px;font-size:12px}
.fc{position:absolute;right:8px;width:38px;height:38px;border-radius:50%;background:#1a1a1cdd;border:1px solid #2a2a2a;display:grid;place-items:center;font-size:18px}
/* launcher */
#launch{overflow-y:auto;background:#101418}
.stat{display:flex;justify-content:space-around;padding:6px 4px 10px}.stat button{padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{background:var(--card);border-radius:18px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;letter-spacing:.04em;color:#fff;word-break:keep-all}
.chip{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 2px 8px #0007}.chip svg{color:#fff}.grid button.st-wait .chip{--c1:#f5a524!important;--c2:#b8760a!important}.grid button.st-ok .chip{--c1:#34c759!important;--c2:#1e9c43!important}
#sbar .st-ok svg,#sbar .st-wait svg{filter:drop-shadow(0 0 3px currentColor)}.hd2{margin-bottom:8px}.hd2 button{background:#222a35;border-radius:12px;padding:7px 14px;font-size:12px;letter-spacing:.06em}
.sheet .lbl{margin-bottom:8px}.row{display:flex;gap:6px;margin-bottom:6px}.row .grow{flex:1;text-align:left;background:#222a35;border-radius:12px;padding:10px 14px;font-size:15px}.row .grow small{display:block;color:var(--mut)}.row button{background:#222a35;border-radius:12px;padding:10px 14px}.addr{display:flex;gap:6px;margin:10px 0}.addr input{flex:1;min-width:0;background:#14181d;color:#fff;border:1px solid #2a3340;border-radius:10px;padding:10px;font-size:15px}.addr button,.sbtn{background:#2f6fe0;border-radius:10px;padding:10px 16px}.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}.kp button{height:min(14vh,60px);background:#222a35;border-radius:14px;font-size:22px}
.smart{margin-top:10px;width:100%;padding:10px;border-radius:16px;background:#1c3a5e;border:1px solid #4a86d4;display:flex;flex-direction:column;align-items:center;gap:2px}
.smart b{display:flex;gap:14px;align-items:center;font-size:18px}.smart small{color:#9fc0ea;letter-spacing:.06em;font-size:11px}
.smart.st-wait{background:#2a2210;border-color:var(--amb)}.smart.st-wait small,.smart.st-wait b{color:var(--amb)}.smart.st-ok{background:#10281a;border-color:var(--grn)}.smart.st-ok small,.smart.st-ok b{color:var(--grn)}
/* info */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hd h1{font-size:18px;font-weight:600;flex:1}.hd h1 small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:400}
.hd button{background:var(--card);border-radius:12px;padding:8px 14px}
.chip{font-size:11px;padding:6px 10px;border-radius:20px;background:var(--card)}
.cards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}
.cd{background:#14181d;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cd svg{width:min(14vh,56px);height:min(14vh,56px)}.cd b{font-size:min(11vh,8vw);font-weight:300}.cd small{font-size:11px;color:var(--mut)}
@media (orientation:portrait){.td{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr}}
/* v5 compact sizing for iPhone 13 landscape */
#top{height:22px;gap:8px;top:env(safe-area-inset-top,0px)}#sbar{gap:0}#sbar button{padding:1px 4px}#sbar svg{width:15px;height:15px}#clk,#tmp{font-size:12px}
.page{top:calc(env(safe-area-inset-top,0px) + 22px);padding:4px 8px}
.td{grid-template-columns:36% 1fr;gap:8px}
.spdwrap{margin-top:2px;padding:0}.spdwrap #spd{font-size:min(21vh,12.5vw);line-height:1}.unit{font-size:12px}
.rp{padding:0 6px}.lbl{font-size:10px}.rpmbar{height:8px;margin:4px 0 2px}.ticks{font-size:9px}
.vbtn{align-self:center;display:grid;place-items:center;width:44px;height:32px;padding:0;border-radius:11px;font-size:0;background:#14181d}.vbtn svg{width:20px;height:20px}
.dots{padding:2px 0 0}.dots i{width:6px;height:6px}
.ban{font-size:11px;padding:4px 7px}.ban button{padding:4px 8px;font-size:11px}
.fc{width:32px;height:32px;font-size:16px}#zin{top:8px!important}#zout{top:46px!important}#recenter{top:84px!important}
.hd2 button{padding:5px 12px;font-size:11px}.grid button{height:66px}.chip{width:32px;height:32px}
/* v6 tesla composition + iOS-style icons */
#top{height:18px;gap:6px}#sbar svg{width:12px;height:12px}#sbar button{padding:0 3px}#clk,#tmp{font-size:11px}
.page{top:calc(env(safe-area-inset-top,0px) + 18px)}
.td{grid-template-columns:38% 1fr}
.prnd{gap:16px;font-size:11px;color:#555}.prnd span.on{color:#fff;font-weight:700}.prnd #gear{font-size:10px;margin-left:6px}
.spdwrap #spd{font-size:min(19vh,11.5vw)}.road{flex:1;min-height:0}
.tb2{display:flex;justify-content:center;align-items:center;gap:clamp(10px,4.5vw,40px);height:42px;flex:none}
.tb2 button{width:46px;height:38px;display:grid;place-items:center;border-radius:12px;color:#9aa3ae}.tb2 button:active{background:#1b2027}.tb2 button svg{width:22px;height:22px}
.tb2 button.cur{color:var(--blue)}.tb2 button.st-wait{color:var(--amb)}.tb2 button.st-ok{color:var(--grn)}
.grid{gap:10px 8px}.grid button{height:auto;padding:9px 2px 7px;border-radius:16px;background:#161b22;gap:6px;font-weight:500;color:#e6e9ee;transition:transform .08s}.grid button:active{transform:scale(.95)}
.chip{width:46px;height:46px;border-radius:22.4%;position:relative;box-shadow:0 3px 10px #0008,inset 0 1px 0 #ffffff55}
.chip::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#ffffff33,transparent 55%)}
.chip svg{width:25px;height:25px;position:relative;z-index:1;filter:drop-shadow(0 1px 1px #0005)}
/* v7 polish + brand icons */
.chip.k-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.chip.k-gm{background:#fff}.chip.k-gm svg{color:#ea4335;stroke-width:2.6;filter:none}
.chip.k-yt svg{stroke-width:1.6}
#launch{background:radial-gradient(ellipse at 50% -10%,#16294a 0%,#0b0e12 72%)}
.grid button{background:#ffffff0e;border:1px solid #ffffff16;box-shadow:0 4px 14px #0006}
.chip{width:48px;height:48px;box-shadow:0 4px 12px #0009,inset 0 1px 0 #ffffff66;box-shadow:0 6px 14px color-mix(in srgb,var(--c2) 50%,transparent),inset 0 1px 0 #ffffff66}
.tl{background:linear-gradient(180deg,#0a0f18,#000 70%);border-radius:16px;padding:4px 4px 2px}
.tmap{box-shadow:0 0 0 1px #ffffff14,0 8px 24px #0009}
.page.on{animation:fi .18s ease}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style></head><body>

  </div>
  <div class="tmap"><canvas id="map"></canvas>
   <div class="ban" id="nvb" style="top:44px;display:none"><span id="nvt"></span><button id="nvx">&#10005;</button></div>

   <button class="fc" id="zin" style="top:8px">+</button><button class="fc" id="zout" style="top:52px">&minus;</button><button class="fc" id="recenter" style="top:100px">&#10148;</button></div>
 </div>
 <div class="tb2">
  <button class="cur" data-act="dash" aria-label="Dashboard"><span data-i="gauge"></span></button>
  <button class="st-wait" id="vbtn" data-go="info" aria-label="Vehicle status"><span data-i="car"></span></button>
  <button data-go="launch" aria-label="Apps"><span data-i="grid"></span></button>
  <button data-act="nav" aria-label="Navigation"><span data-i="map"></span></button>
  <button data-act="music" aria-label="Music"><span data-i="music"></span></button>
  <button data-act="phone" aria-label="Phone"><span data-i="phone"></span></button>
 </div>
</section>

<section class="page" id="launch">
 <div class="hd2"><button data-go="dash">&#9664; DASHBOARD</button></div><div class="grid" id="apps"></div>
 <button class="smart st-wait" id="smart"><b><span data-i="chev"></span>SMART CONTROL<span data-i="sliders"></span></b><small>ESP32 CONNECTION &amp; CONTROL</small></button>
 <div class="dots"><i data-go="dash"></i><i class="on" data-go="launch"></i></div>
</section>

<section class="page" id="info">
 <div class="hd"><button data-go="back">&#9664;</button><h1>اطلاعات خودرو<small>VEHICLE STATUS</small></h1><span class="chip st-wait" id="obdchip">OBD2: not connected</span></div>
 <div class="cards">
  <div class="cd st-wait" id="c_cool"><span data-i="therm"></span><small>ENGINE COOLANT</small><b id="i_cool">--</b><small>&deg;C</small></div>
  <div class="cd st-wait" id="c_oil"><span data-i="oil"></span><small>ENGINE OIL</small><b id="i_oil">--</b><small>&deg;C</small></div>
  <div class="cd st-wait" id="c_bat"><span data-i="bat"></span><small>BATTERY</small><b id="i_bat">--</b><small>V</small></div>
 </div>
</section>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="sheet" id="sheet"><button id="shx">&#10005;</button><div id="shb"></div></div>
<div class="toast" id="toast"></div><div class="dim" id="dim"></div>
